name: BTCUSDT weekly research

on:
  push:
    branches: [main]
    paths:
      - 'quant/**'
      - 'tests/test_quant.py'
      - '.github/workflows/btc_week_research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '6bff289cb8f46370091810ca031fe54a90913986d96b674afadb363b3ca00fc6  quant/source_bundle.tar.gz' | sha256sum -c -
          tar -xzf quant/source_bundle.tar.gz -C .
      - name: Install research dependencies
        run: python -m pip install -r quant/requirements.txt
      - name: Run causal and accounting tests
        run: python -m pytest -q tests/test_quant.py
      - name: Download real Binance data and run backtests
        run: python -m quant.research --config quant/config.json
      - name: Upload full research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-week-research-${{ github.run_id }}
          path: |
            data/market/
            reports/btcusdt_week_20260902_09/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit verified data, source and reports
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quant/research.py quant/config.json quant/requirements.txt quant/__init__.py quant/README.md tests/test_quant.py data/market/ reports/btcusdt_week_20260902_09/
          if git diff --cached --quiet; then
            echo 'No new research files to commit.'
            exit 0
          fi
          git commit -m 'research: record verified BTCUSDT week backtest and evidence'
          git push origin HEAD:main
